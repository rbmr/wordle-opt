name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run viewer logic tests
      # site/policy-core.js is the viewer's pure logic (response computation,
      # candidate filtering, validation, win rule). The test pins it against the
      # Rust response fixtures and validates every bundled example tree.
      run: node site/policy-core.test.js

    - name: Run tests
      # --release: several tests (the golden regression tests in particular)
      # run the real solver on real instances and are far too slow in debug
      # builds. --test-threads=1: multiple tests each internally use rayon
      # across all cores; running them concurrently oversubscribes CPU and
      # makes the whole suite slower, not faster - serializing tests lets
      # each one get full-core throughput in turn.
      run: cargo test --release --verbose -- --test-threads=1

    - name: Run clippy
      run: cargo clippy --release -- -D warnings

    - name: Run fmt
      run: cargo fmt -- --check
