[workspace]
members = ["crates/wordle-common", "crates/wordle-solver", "crates/wordle-checker"]
# Plain `cargo test`, `cargo clippy` and `cargo build` cover every crate.
default-members = [".", "crates/wordle-common", "crates/wordle-solver", "crates/wordle-checker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Robert Mertens <robertmertens10@gmail.com>"]
repository = "https://github.com/rbmr/wordle-opt"
license = "MIT"

[workspace.dependencies]
fastrand = "2.0.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wordle-common = { path = "crates/wordle-common" }
wordle-solver = { path = "crates/wordle-solver" }
wordle-checker = { path = "crates/wordle-checker" }

[package]
name = "wordle-opt"
description = "A mathematically optimal, SIMD-parallelized Wordle solver designed to compute the theoretically perfect guessing strategy."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Records every transposition-table write with the candidate set it is for,
# so `tests/tt_audit.rs` can check each stored value. Off by default; it slows
# the search down and is only for testing.
tt-audit = ["wordle-solver/tt-audit"]

[dependencies]
wordle-common.workspace = true
wordle-solver.workspace = true
wordle-checker.workspace = true
fastrand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
# `default-features = false` drops the `arrow` integration (which this crate
# does not need) while keeping the low-level column writer used for the
# optional solve-trace export. `snap` is the codec applied to those files.
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8.0"
rustc-hash.workspace = true

[profile.release]
lto = true
codegen-units = 1
debug = true

[[bench]]
name = "solver_bench"
harness = false
