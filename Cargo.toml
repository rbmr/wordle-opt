[package]
name = "wordle-opt"
version = "0.1.0"
edition = "2024"
authors = ["Robert Mertens <robertmertens10@gmail.com>"]
description = "A mathematically optimal, SIMD-parallelized Wordle solver designed to compute the theoretically perfect guessing strategy."
repository = "https://github.com/rbmr/wordle-opt"
license = "MIT"

[dependencies]
lazy_static = "1.5.0"
fastrand = "2.0.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `default-features = false` drops the `arrow` integration (which this crate
# does not need) while keeping the low-level column writer used for the
# optional solve-trace export. `snap` is the codec applied to those files.
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8.0"

[profile.release]
lto = true
codegen-units = 1
debug = true


[[bench]]
name = "solver_bench"
harness = false

[build-dependencies]
cc = "1.5.1"

